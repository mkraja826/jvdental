name: JV Dental CI

on:
  push:
    branches:
      - main
      - build/platform-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Production security and route smoke tests
        run: |
          npm run start > /tmp/jv-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          fail() {
            echo "::error::$1"
            echo "--- next-server log ---"
            cat /tmp/jv-next.log || true
            exit 1
          }

          READY=0
          for attempt in $(seq 1 20); do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              fail "Production server exited before becoming ready"
            fi
            STATUS=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/robots.txt || true)
            if [ "$STATUS" = "200" ]; then
              READY=1
              echo "Production server ready on attempt ${attempt}"
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            fail "Production server did not become ready within 20 seconds"
          fi

          PUBLIC_HEADERS=$(curl -sSI http://127.0.0.1:3000/robots.txt) || fail "Could not read public security headers"
          echo "$PUBLIC_HEADERS" | grep -qi '^content-security-policy:' || fail "Missing Content-Security-Policy header"
          echo "$PUBLIC_HEADERS" | grep -qi '^x-content-type-options: nosniff' || fail "Missing X-Content-Type-Options: nosniff"
          echo "$PUBLIC_HEADERS" | grep -qi '^x-frame-options: DENY' || fail "Missing X-Frame-Options: DENY"
          echo "$PUBLIC_HEADERS" | grep -qi '^referrer-policy: strict-origin-when-cross-origin' || fail "Unexpected Referrer-Policy"
          echo "$PUBLIC_HEADERS" | grep -qi '^strict-transport-security:' || fail "Missing Strict-Transport-Security header"
          echo "Public security headers passed"

          ROBOTS=$(curl -sS http://127.0.0.1:3000/robots.txt) || fail "Could not read robots.txt"
          echo "$ROBOTS" | grep -Fq 'Disallow: /patient' || fail "robots.txt does not exclude /patient"
          echo "$ROBOTS" | grep -Fq 'Disallow: /clinic' || fail "robots.txt does not exclude /clinic"
          echo "$ROBOTS" | grep -Fq 'Disallow: /staff' || fail "robots.txt does not exclude /staff"
          echo "$ROBOTS" | grep -Fq 'Disallow: /auth' || fail "robots.txt does not exclude /auth"
          echo "$ROBOTS" | grep -Fq 'Sitemap: http://localhost:3000/sitemap.xml' || fail "robots.txt sitemap URL is incorrect"
          echo "robots.txt checks passed"

          for ROUTE in \
            '/patient/login' \
            '/staff/login' \
            '/auth/forgot-password?audience=patient' \
            '/auth/forgot-password?audience=staff' \
            '/auth/update-password?audience=patient' \
            '/auth/update-password?audience=staff' \
            '/book'; do
            STATUS=$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000${ROUTE}" || true)
            if [ "$STATUS" != "200" ]; then
              fail "Route smoke test failed: ${ROUTE} returned ${STATUS}"
            fi
            echo "Route passed: ${ROUTE}"
          done

          for REDIRECT_SPEC in \
            '/services|/dental-treatments' \
            '/services/legacy-pediatric|/dental-treatments' \
            '/contact-us|/book'; do
            SOURCE=${REDIRECT_SPEC%%|*}
            DESTINATION=${REDIRECT_SPEC#*|}
            REDIRECT_HEADERS=$(curl -sS -D - -o /dev/null "http://127.0.0.1:3000${SOURCE}") || fail "Could not request legacy route ${SOURCE}"
            REDIRECT_STATUS=$(printf '%s\n' "$REDIRECT_HEADERS" | awk 'NR == 1 { print $2 }')
            REDIRECT_LOCATION=$(printf '%s\n' "$REDIRECT_HEADERS" | awk 'tolower($1) == "location:" { print $2; exit }' | tr -d '\r')
            if [ "$REDIRECT_STATUS" != "307" ] && [ "$REDIRECT_STATUS" != "308" ]; then
              fail "Legacy route ${SOURCE} returned ${REDIRECT_STATUS}, expected 307/308"
            fi
            if [ "$REDIRECT_LOCATION" != "$DESTINATION" ]; then
              fail "Legacy route ${SOURCE} redirected to '${REDIRECT_LOCATION}', expected '${DESTINATION}'"
            fi
            echo "Legacy redirect passed: ${SOURCE} -> ${DESTINATION}"
          done

          for PRIVATE_ROUTE in \
            '/patient/login' \
            '/staff/login' \
            '/auth/forgot-password?audience=staff' \
            '/auth/update-password?audience=staff'; do
            PRIVATE_HEADERS=$(curl -sSI "http://127.0.0.1:3000${PRIVATE_ROUTE}") || fail "Could not read private headers for ${PRIVATE_ROUTE}"
            echo "$PRIVATE_HEADERS" | grep -qi '^cache-control: private, no-store, max-age=0' || fail "Private cache header missing on ${PRIVATE_ROUTE}"
            echo "$PRIVATE_HEADERS" | grep -qi '^x-robots-tag: noindex, nofollow, noarchive, nosnippet' || fail "Private X-Robots-Tag missing on ${PRIVATE_ROUTE}"
            echo "Private headers passed: ${PRIVATE_ROUTE}"
          done

          echo "All production security and route smoke tests passed"
