name: JV Dental CI

on:
  push:
    branches:
      - main
      - build/platform-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Production security and route smoke tests
        run: |
          npm run start > /tmp/jv-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          READY=0
          for attempt in $(seq 1 20); do
            if curl -fsS -o /dev/null http://127.0.0.1:3000/robots.txt; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            cat /tmp/jv-next.log
            exit 1
          fi

          PUBLIC_HEADERS=$(curl -fsSI http://127.0.0.1:3000/robots.txt)
          echo "$PUBLIC_HEADERS" | grep -qi '^content-security-policy:'
          echo "$PUBLIC_HEADERS" | grep -qi '^x-content-type-options: nosniff'
          echo "$PUBLIC_HEADERS" | grep -qi '^x-frame-options: DENY'
          echo "$PUBLIC_HEADERS" | grep -qi '^referrer-policy: strict-origin-when-cross-origin'
          echo "$PUBLIC_HEADERS" | grep -qi '^strict-transport-security:'

          ROBOTS=$(curl -fsS http://127.0.0.1:3000/robots.txt)
          echo "$ROBOTS" | grep -q 'Disallow: /patient'
          echo "$ROBOTS" | grep -q 'Disallow: /clinic'
          echo "$ROBOTS" | grep -q 'Disallow: /staff'
          echo "$ROBOTS" | grep -q 'Disallow: /auth'
          echo "$ROBOTS" | grep -q 'Sitemap: http://localhost:3000/sitemap.xml'

          for ROUTE in \
            '/patient/login' \
            '/staff/login' \
            '/auth/forgot-password?audience=patient' \
            '/auth/forgot-password?audience=staff' \
            '/auth/update-password?audience=patient' \
            '/auth/update-password?audience=staff' \
            '/book'; do
            STATUS=$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000${ROUTE}")
            if [ "$STATUS" != "200" ]; then
              echo "Route smoke test failed: ${ROUTE} returned ${STATUS}"
              cat /tmp/jv-next.log
              exit 1
            fi
          done

          for PRIVATE_ROUTE in \
            '/patient/login' \
            '/staff/login' \
            '/auth/forgot-password?audience=staff' \
            '/auth/update-password?audience=staff'; do
            PRIVATE_HEADERS=$(curl -fsSI "http://127.0.0.1:3000${PRIVATE_ROUTE}")
            echo "$PRIVATE_HEADERS" | grep -qi '^cache-control: private, no-store, max-age=0'
            echo "$PRIVATE_HEADERS" | grep -qi '^x-robots-tag: noindex, nofollow, noarchive, nosnippet'
          done
